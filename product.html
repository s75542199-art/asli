<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>جزئیات محصول | فروشگاه فورمو</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #6c5ce7; --primary-dark: #5b4bc4; --secondary: #fd79a8;
            --success: #00b894; --warning: #fdcb6e; --danger: #e74c3c;
            --dark: #2d3436; --gray: #b2bec3; --light: #f8f9fa; --white: #ffffff;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
            --shadow-md: 0 5px 20px rgba(0,0,0,0.08);
            --shadow-lg: 0 15px 35px rgba(0,0,0,0.12);
            --transition: all 0.3s ease;
            --radius: 12px; --radius-lg: 20px;
        }
        body {
            font-family: 'Tahoma', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            direction: rtl;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        /* هدر */
        .header {
            background: white;
            border-radius: 20px;
            padding: 15px 25px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: var(--shadow-sm);
        }
        .logo { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .logo-icon {
            width: 45px; height: 45px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
        }
        .logo h1 { font-size: 22px; color: #333; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { text-decoration: none; color: #666; transition: var(--transition); }
        .nav-links a:hover { color: var(--primary); }
        .back-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: var(--transition);
        }
        .back-btn:hover { transform: translateY(-2px); background: var(--primary-dark); }

        /* breadcrumb */
        .breadcrumb {
            background: white;
            border-radius: 12px;
            padding: 12px 20px;
            margin-bottom: 25px;
            font-size: 13px;
        }
        .breadcrumb a { color: var(--gray); text-decoration: none; }
        .breadcrumb a:hover { color: var(--primary); }
        .breadcrumb span { color: #333; }

        /* محصول */
        .product-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            background: white;
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: var(--shadow-lg);
        }
        /* گالری */
        .gallery-main {
            width: 100%;
            height: 400px;
            background: var(--light);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .gallery-main img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .gallery-main span { font-size: 100px; }
        .gallery-thumbs {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            overflow-x: auto;
        }
        .thumb {
            width: 80px;
            height: 80px;
            background: var(--light);
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            border: 2px solid transparent;
        }
        .thumb.active { border-color: var(--primary); }
        .thumb img { max-width: 80%; max-height: 80%; object-fit: contain; }
        .thumb span { font-size: 35px; }

        .product-title { font-size: 24px; color: #333; margin-bottom: 10px; }
        .product-price {
            display: flex;
            align-items: baseline;
            gap: 15px;
            margin: 15px 0;
            padding: 15px 0;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }
        .current-price { color: var(--danger); font-size: 28px; font-weight: bold; }
        .old-price { color: var(--gray); font-size: 16px; text-decoration: line-through; }
        .discount-badge {
            background: var(--danger);
            color: white;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 14px;
        }
        .rating {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
        }
        .stars { color: #f39c12; font-size: 18px; }
        .rating-count { color: var(--gray); font-size: 13px; }
        .stock {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 13px;
            margin: 15px 0;
        }
        .stock.available { background: #e8f8f5; color: #00b894; }
        .stock.unavailable { background: #fee; color: var(--danger); }
        .product-desc { color: #666; line-height: 1.8; margin: 15px 0; padding: 15px 0; border-top: 1px solid #eee; }
        .product-actions {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .add-to-cart-btn {
            flex: 2;
            background: linear-gradient(135deg, var(--success), #00a884);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: var(--transition);
        }
        .add-to-cart-btn:hover { transform: translateY(-2px); }
        .wishlist-btn {
            flex: 1;
            background: white;
            border: 2px solid #ddd;
            padding: 12px;
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
        }
        .wishlist-btn.active { border-color: var(--danger); color: var(--danger); }
        .buy-now-btn {
            flex: 2;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 14px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: var(--transition);
        }
        .quantity-selector {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
        }
        .quantity-btn {
            width: 35px;
            height: 35px;
            background: var(--light);
            border: none;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
        }
        .quantity-input {
            width: 60px;
            height: 35px;
            text-align: center;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        /* بخش نظرات - با اسکرول */
        .reviews-section {
            background: white;
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: var(--shadow-lg);
        }
        .reviews-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        .reviews-header h2 { font-size: 20px; }
        .avg-rating {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .avg-score { font-size: 32px; font-weight: bold; color: #f39c12; }
        .add-review-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 30px;
            cursor: pointer;
        }
        
        /* لیست نظرات با اسکرول - ارتفاع محدود */
        .reviews-list-container {
            max-height: 400px;
            overflow-y: auto;
            padding-left: 10px;
        }
        .reviews-list-container::-webkit-scrollbar {
            width: 6px;
        }
        .reviews-list-container::-webkit-scrollbar-track {
            background: #f0f0f0;
            border-radius: 10px;
        }
        .reviews-list-container::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }
        
        .review-card {
            padding: 20px;
            border-bottom: 1px solid #eee;
            background: #fff;
            transition: var(--transition);
        }
        .review-card:hover {
            background: #fafafa;
        }
        .review-user {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }
        .review-user i { font-size: 40px; color: var(--primary); }
        .review-user-info h4 { font-size: 14px; }
        .review-user-info span { font-size: 11px; color: var(--gray); }
        .review-stars { color: #f39c12; font-size: 13px; margin: 5px 0; }
        .review-text { color: #666; line-height: 1.6; margin-top: 10px; }
        .empty-reviews { text-align: center; padding: 40px; color: var(--gray); }
        
        /* نشان دادن تعداد نظرات */
        .reviews-count-badge {
            background: var(--light);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 12px;
            color: var(--dark);
        }

        /* محصولات مشابه */
        .similar-section {
            background: white;
            border-radius: 25px;
            padding: 30px;
            box-shadow: var(--shadow-lg);
        }
        .similar-title { font-size: 20px; margin-bottom: 20px; }
        .similar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        .similar-card {
            background: var(--light);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
        }
        .similar-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-md); }
        .similar-img { font-size: 50px; margin-bottom: 10px; }
        .similar-name { font-size: 13px; font-weight: bold; margin-bottom: 5px; }
        .similar-price { color: var(--danger); font-size: 14px; font-weight: bold; }

        /* مودال نظر */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: white;
            border-radius: 25px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .rating-input {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            font-size: 30px;
            cursor: pointer;
        }
        .rating-input i { color: #ddd; transition: var(--transition); }
        .rating-input i.active { color: #f39c12; }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: var(--success);
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            z-index: 3000;
            transform: translateX(-400px);
            transition: transform 0.3s;
        }
        .toast.show { transform: translateX(0); }
        .toast.error { background: var(--danger); }

        .footer {
            background: var(--dark);
            color: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            margin-top: 30px;
        }
        .footer a { color: #b2bec3; text-decoration: none; margin: 0 10px; }
        .footer a:hover { color: var(--primary); }

        @media (max-width: 768px) {
            .product-grid { grid-template-columns: 1fr; }
            .gallery-main { height: 250px; }
            .container { padding: 15px; }
            .header { flex-direction: column; text-align: center; }
            .reviews-list-container { max-height: 300px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo" onclick="window.location.href='shop.html'">
            <div class="logo-icon"><i class="fas fa-feather-alt"></i></div>
            <h1>فروشگاه فورمو</h1>
        </div>
        <div class="nav-links">
            <a href="shop.html">فروشگاه</a>
            <a href="about.html">درباره ما</a>
            <a href="contact.html">تماس با ما</a>
        </div>
        <button class="back-btn" onclick="window.location.href='shop.html'">
            <i class="fas fa-arrow-right"></i> بازگشت
        </button>
    </div>

    <div class="breadcrumb">
        <a href="shop.html">خانه</a> / <a href="shop.html">فروشگاه</a> / <span id="breadcrumbCategory"></span> / <span id="breadcrumbName"></span>
    </div>

    <div id="productContainer">
        <div class="product-grid">
            <div>
                <div class="gallery-main" id="mainImage"></div>
                <div class="gallery-thumbs" id="thumbnails"></div>
            </div>
            <div>
                <h1 class="product-title" id="productName"></h1>
                <div class="rating" id="productRating"></div>
                <div class="product-price" id="productPrice"></div>
                <div class="stock" id="productStock"></div>
                <div class="quantity-selector">
                    <button class="quantity-btn" onclick="changeQty(-1)">-</button>
                    <input type="number" class="quantity-input" id="quantity" value="1" min="1">
                    <button class="quantity-btn" onclick="changeQty(1)">+</button>
                </div>
                <div class="product-actions">
                    <button class="add-to-cart-btn" onclick="addToCart()"><i class="fas fa-shopping-cart"></i> افزودن به سبد خرید</button>
                    <button class="wishlist-btn" id="wishlistBtn" onclick="toggleWishlist()"><i class="far fa-heart"></i> علاقه‌مندی</button>
                </div>
                <div class="product-actions">
                    <button class="buy-now-btn" onclick="buyNow()"><i class="fas fa-bolt"></i> خرید سریع</button>
                </div>
                <div class="product-desc" id="productDesc"></div>
            </div>
        </div>
    </div>

    <!-- بخش نظرات با اسکرول -->
    <div class="reviews-section">
        <div class="reviews-header">
            <h2><i class="fas fa-comments"></i> نظرات کاربران <span class="reviews-count-badge" id="reviewsCount">0</span></h2>
            <div class="avg-rating" id="avgRating"></div>
            <button class="add-review-btn" onclick="openReviewModal()"><i class="fas fa-plus"></i> افزودن نظر</button>
        </div>
        
        <!-- کانتینر نظرات با اسکرول -->
        <div class="reviews-list-container" id="reviewsListContainer">
            <div id="reviewsList"></div>
        </div>
    </div>

    <div class="similar-section" id="similarSection" style="display: none;">
        <h2 class="similar-title"><i class="fas fa-tags"></i> محصولات مشابه</h2>
        <div class="similar-grid" id="similarProducts"></div>
    </div>

    <div class="footer">
        <p>© ۱۴۰۳ فروشگاه فورمو - تمامی حقوق محفوظ است</p>
        <p style="margin-top: 10px;">
            <a href="about.html">درباره ما</a>
            <a href="contact.html">تماس با ما</a>
            <a href="faq.html">سوالات متداول</a>
            <a href="terms.html">قوانین</a>
        </p>
    </div>
</div>

<div id="reviewModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fas fa-star"></i> ثبت نظر و امتیاز</h3>
            <button class="close-modal" onclick="closeReviewModal()" style="background:none; border:none; font-size:24px; cursor:pointer;">&times;</button>
        </div>
        <div class="form-group">
            <label>نام شما</label>
            <input type="text" id="reviewerName" placeholder="نام خود را وارد کنید" style="width:100%; padding:10px; border-radius:10px; border:1px solid #ddd;">
        </div>
        <div class="form-group">
            <label>امتیاز شما</label>
            <div class="rating-input" id="ratingStars">
                <i class="far fa-star" data-rating="1"></i>
                <i class="far fa-star" data-rating="2"></i>
                <i class="far fa-star" data-rating="3"></i>
                <i class="far fa-star" data-rating="4"></i>
                <i class="far fa-star" data-rating="5"></i>
            </div>
            <input type="hidden" id="reviewRating" value="0">
        </div>
        <div class="form-group">
            <label>نظر شما</label>
            <textarea id="reviewText" rows="4" placeholder="نظر خود را بنویسید..." style="width:100%; padding:10px; border-radius:10px; border:1px solid #ddd;"></textarea>
        </div>
        <button class="submit-btn" onclick="submitReview()" style="width:100%; background:linear-gradient(135deg, #6c5ce7, #a29bfe); color:white; border:none; padding:12px; border-radius:30px; cursor:pointer; margin-top:10px;">ثبت نظر</button>
    </div>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span></div>

<script>
    const STORAGE_KEY = 'fashion_products';
    let products = [];
    let currentProduct = null;
    let currentProductId = null;
    let currentRating = 0;

    function getProductIdFromUrl() {
        const params = new URLSearchParams(window.location.search);
        return parseInt(params.get('id'));
    }

    function loadProducts() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            products = JSON.parse(saved);
        } else {
            products = [
                { id: 1, name: "تیشرت مردانه کلاسیک", price: 250000, oldPrice: 320000, category: "men", emoji: "👕", rating: 4.8, reviews: 124, desc: "نخ مرغوب، ضد تعریق، قابل شستشو", isNew: true, isAmazing: true, stock: 45, imageData: null },
                { id: 2, name: "پیراهن مردانه مجلسی", price: 480000, oldPrice: 620000, category: "men", emoji: "👔", rating: 4.6, reviews: 89, desc: "پارچه ایتالیایی، مناسب مهمانی", isNew: false, isAmazing: false, stock: 32, imageData: null },
                { id: 3, name: "شلوار جین اسلیم", price: 450000, oldPrice: 550000, category: "men", emoji: "👖", rating: 4.7, reviews: 156, desc: "جین اصلی، قد بلند", isNew: false, isAmazing: false, stock: 68, imageData: null },
                { id: 4, name: "کت اسپرت مردانه", price: 1200000, oldPrice: 1500000, category: "men", emoji: "🧥", rating: 4.9, reviews: 67, desc: "پارچه کتان، مناسب فصل پاییز", isNew: true, isAmazing: true, stock: 23, imageData: null },
                { id: 5, name: "لباس مجلسی زنانه", price: 780000, oldPrice: 980000, category: "women", emoji: "👗", rating: 4.9, reviews: 234, desc: "تول، پولک دوزی، مناسب عروسی", isNew: true, isAmazing: true, stock: 34, imageData: null },
                { id: 6, name: "مانتو تابستانی", price: 650000, oldPrice: 780000, category: "women", emoji: "🧥", rating: 4.7, reviews: 189, desc: "کتانی، خنک، مناسب هوای گرم", isNew: false, isAmazing: false, stock: 56, imageData: null },
                { id: 7, name: "کیف چرم زنانه", price: 890000, oldPrice: 1200000, category: "bag", emoji: "👜", rating: 4.8, reviews: 98, desc: "چرم اصل، دست ساز", isNew: true, isAmazing: true, stock: 23, imageData: null }
            ];
        }
    }

    function loadProduct() {
        currentProductId = getProductIdFromUrl();
        if (!currentProductId) {
            window.location.href = 'shop.html';
            return;
        }
        currentProduct = products.find(p => p.id === currentProductId);
        if (!currentProduct) {
            window.location.href = 'shop.html';
            return;
        }
        displayProduct();
        loadReviews();
        loadSimilarProducts();
    }

    function displayProduct() {
        document.getElementById('productName').innerText = currentProduct.name;
        document.getElementById('breadcrumbName').innerText = currentProduct.name;
        document.getElementById('breadcrumbCategory').innerText = getCategoryName(currentProduct.category);
        
        let priceHtml = `<span class="current-price">${currentProduct.price.toLocaleString()} تومان</span>`;
        if (currentProduct.oldPrice) {
            priceHtml += `<span class="old-price">${currentProduct.oldPrice.toLocaleString()} تومان</span>`;
            const discount = Math.round(((currentProduct.oldPrice - currentProduct.price) / currentProduct.oldPrice) * 100);
            priceHtml += `<span class="discount-badge">${discount}٪ تخفیف</span>`;
        }
        document.getElementById('productPrice').innerHTML = priceHtml;
        
        document.getElementById('productRating').innerHTML = `
            <div class="stars">${getStarsHtml(currentProduct.rating)}</div>
            <span class="rating-count">(${currentProduct.reviews || 0} نظر)</span>
        `;
        
        const stockAvailable = currentProduct.stock > 0;
        document.getElementById('productStock').innerHTML = `
            <span class="stock ${stockAvailable ? 'available' : 'unavailable'}">
                <i class="fas ${stockAvailable ? 'fa-check-circle' : 'fa-times-circle'}"></i>
                ${stockAvailable ? `موجود در انبار (${currentProduct.stock} عدد)` : 'ناموجود'}
            </span>
        `;
        
        document.getElementById('productDesc').innerHTML = `<strong>توضیحات محصول:</strong><br>${currentProduct.desc}`;
        
        const mainDiv = document.getElementById('mainImage');
        if (currentProduct.imageData) {
            mainDiv.innerHTML = `<img src="${currentProduct.imageData}" alt="${currentProduct.name}">`;
        } else {
            mainDiv.innerHTML = `<span>${currentProduct.emoji}</span>`;
        }
        
        const emojis = [currentProduct.emoji, getCategoryEmoji(currentProduct.category), "📦", "✨"];
        document.getElementById('thumbnails').innerHTML = emojis.map((emoji, i) => `
            <div class="thumb" onclick="changeImage('${emoji}')">
                <span>${emoji}</span>
            </div>
        `).join('');
        
        updateWishlistButton();
    }

    function changeImage(src) {
        document.getElementById('mainImage').innerHTML = `<span>${src}</span>`;
    }

    function getStarsHtml(rating) {
        let stars = '';
        for (let i = 1; i <= 5; i++) {
            if (i <= Math.floor(rating)) {
                stars += '<i class="fas fa-star"></i>';
            } else if (i - rating < 0.5) {
                stars += '<i class="fas fa-star-half-alt"></i>';
            } else {
                stars += '<i class="far fa-star"></i>';
            }
        }
        return stars;
    }

    function getCategoryName(cat) {
        const names = { men: 'مردانه', women: 'زنانه', kids: 'کودک', sport: 'ورزشی', digital: 'دیجیتال', home: 'خانه', beauty: 'آرایشی', book: 'کتاب', bag: 'کیف و کفش', accessory: 'اکسسوری' };
        return names[cat] || cat;
    }

    function getCategoryEmoji(cat) {
        const emojis = { men: "👔", women: "👗", kids: "🧸", sport: "⚽", digital: "📱", home: "🏠", beauty: "💄", book: "📚", bag: "👜", accessory: "💍" };
        return emojis[cat] || "📦";
    }

    let quantity = 1;
    function changeQty(delta) {
        quantity += delta;
        if (quantity < 1) quantity = 1;
        if (currentProduct && quantity > currentProduct.stock) quantity = currentProduct.stock;
        document.getElementById('quantity').value = quantity;
    }

    function addToCart() {
        let cart = JSON.parse(localStorage.getItem('fashionCart')) || [];
        const existing = cart.find(i => i.id === currentProduct.id);
        const qty = parseInt(document.getElementById('quantity').value);
        
        if (existing) {
            existing.quantity += qty;
        } else {
            cart.push({ ...currentProduct, quantity: qty });
        }
        localStorage.setItem('fashionCart', JSON.stringify(cart));
        showToast(`${currentProduct.name} به سبد خرید اضافه شد`);
        updateCartCount();
    }

    function buyNow() {
        addToCart();
        window.location.href = 'checkout.html';
    }

    function updateCartCount() {
        const cart = JSON.parse(localStorage.getItem('fashionCart')) || [];
        const count = cart.reduce((s, i) => s + i.quantity, 0);
        const cartCountSpan = document.getElementById('cartCount');
        if (cartCountSpan) cartCountSpan.innerText = count;
    }

    function toggleWishlist() {
        let wishlist = JSON.parse(localStorage.getItem('fashionWishlist')) || [];
        if (wishlist.includes(currentProduct.id)) {
            wishlist = wishlist.filter(id => id !== currentProduct.id);
            showToast(`${currentProduct.name} از علاقه‌مندی‌ها حذف شد`);
        } else {
            wishlist.push(currentProduct.id);
            showToast(`${currentProduct.name} به علاقه‌مندی‌ها اضافه شد`);
        }
        localStorage.setItem('fashionWishlist', JSON.stringify(wishlist));
        updateWishlistButton();
    }

    function updateWishlistButton() {
        const wishlist = JSON.parse(localStorage.getItem('fashionWishlist')) || [];
        const btn = document.getElementById('wishlistBtn');
        if (wishlist.includes(currentProduct.id)) {
            btn.classList.add('active');
            btn.innerHTML = '<i class="fas fa-heart"></i> حذف از علاقه‌مندی';
        } else {
            btn.classList.remove('active');
            btn.innerHTML = '<i class="far fa-heart"></i> علاقه‌مندی';
        }
    }

    // ========== بخش نظرات با نمایش 3 نظر آخر و اسکرول ==========
    function loadReviews() {
        const reviews = JSON.parse(localStorage.getItem(`product_reviews_${currentProduct.id}`)) || [];
        const avgRating = calculateAvgRating(reviews);
        
        // نمایش میانگین امتیاز
        document.getElementById('avgRating').innerHTML = `
            <div class="avg-score">${avgRating.toFixed(1)}</div>
            <div class="stars">${getStarsHtml(avgRating)}</div>
        `;
        
        // تعداد نظرات
        document.getElementById('reviewsCount').innerText = reviews.length;
        
        const reviewsList = document.getElementById('reviewsList');
        if (reviews.length === 0) {
            reviewsList.innerHTML = '<div class="empty-reviews"><i class="fas fa-comment-dots"></i><p>هنوز نظری ثبت نشده است. اولین نفری باشید که نظر می‌دهید!</p></div>';
            return;
        }
        
        // مرتب‌سازی نظرات از جدید به قدیم و گرفتن 3 تای آخر (جدیدترین)
        const sortedReviews = [...reviews].sort((a, b) => new Date(b.date) - new Date(a.date));
        
        // نمایش همه نظرات (برای اسکرول) ولی با برچسب جدیدترین‌ها
        reviewsList.innerHTML = sortedReviews.map(r => `
            <div class="review-card">
                <div class="review-user">
                    <i class="fas fa-user-circle"></i>
                    <div class="review-user-info">
                        <h4>${r.name} ${isNewReview(r.date) ? '<span style="background:#f39c12; color:white; padding:2px 8px; border-radius:20px; font-size:10px; margin-right:8px;">جدید</span>' : ''}</h4>
                        <span>${r.date}</span>
                    </div>
                </div>
                <div class="review-stars">${getStarsHtml(r.rating)}</div>
                <div class="review-text">${r.text}</div>
            </div>
        `).join('');
    }

    // تشخیص نظر جدید (کمتر از 7 روز)
    function isNewReview(dateStr) {
        const reviewDate = new Date(dateStr.split('/').map((v, i) => i === 0 ? Number(v) + 1300 : Number(v)).join('/'));
        const now = new Date();
        const diffDays = (now - reviewDate) / (1000 * 60 * 60 * 24);
        return diffDays < 7;
    }

    function calculateAvgRating(reviews) {
        if (reviews.length === 0) return 0;
        const sum = reviews.reduce((s, r) => s + r.rating, 0);
        return sum / reviews.length;
    }

    function openReviewModal() {
        document.getElementById('reviewModal').classList.add('show');
        currentRating = 0;
        document.getElementById('reviewRating').value = 0;
        document.querySelectorAll('.rating-input i').forEach(star => {
            star.classList.remove('active');
            star.classList.add('far');
        });
        document.getElementById('reviewerName').value = localStorage.getItem('fashionUser') || '';
        document.getElementById('reviewText').value = '';
    }

    function closeReviewModal() {
        document.getElementById('reviewModal').classList.remove('show');
    }

    function setupRatingStars() {
        const stars = document.querySelectorAll('.rating-input i');
        stars.forEach(star => {
            star.onclick = () => {
                const rating = parseInt(star.dataset.rating);
                currentRating = rating;
                document.getElementById('reviewRating').value = rating;
                stars.forEach((s, i) => {
                    if (i < rating) {
                        s.classList.add('active');
                        s.classList.remove('far');
                        s.classList.add('fas');
                    } else {
                        s.classList.remove('active');
                        s.classList.remove('fas');
                        s.classList.add('far');
                    }
                });
            };
        });
    }

    function submitReview() {
        const name = document.getElementById('reviewerName').value.trim();
        const rating = currentRating;
        const text = document.getElementById('reviewText').value.trim();
        
        if (!name) {
            showToast('لطفاً نام خود را وارد کنید', 'error');
            return;
        }
        if (rating === 0) {
            showToast('لطفاً امتیاز خود را انتخاب کنید', 'error');
            return;
        }
        if (!text) {
            showToast('لطفاً نظر خود را بنویسید', 'error');
            return;
        }
        
        const reviews = JSON.parse(localStorage.getItem(`product_reviews_${currentProduct.id}`)) || [];
        reviews.push({
            id: Date.now(),
            name: name,
            rating: rating,
            text: text,
            date: new Date().toLocaleDateString('fa-IR')
        });
        localStorage.setItem(`product_reviews_${currentProduct.id}`, JSON.stringify(reviews));
        
        const newAvg = calculateAvgRating(reviews);
        currentProduct.rating = newAvg;
        currentProduct.reviews = reviews.length;
        saveProductsToStorage();
        
        closeReviewModal();
        loadReviews();
        displayProduct();
        showToast('نظر شما با موفقیت ثبت شد');
    }

    function saveProductsToStorage() {
        const index = products.findIndex(p => p.id === currentProduct.id);
        if (index !== -1) {
            products[index] = currentProduct;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
        }
    }

    function loadSimilarProducts() {
        const similar = products.filter(p => p.category === currentProduct.category && p.id !== currentProduct.id).slice(0, 4);
        const container = document.getElementById('similarProducts');
        const section = document.getElementById('similarSection');
        
        if (similar.length === 0) {
            section.style.display = 'none';
            return;
        }
        
        section.style.display = 'block';
        container.innerHTML = similar.map(p => `
            <div class="similar-card" onclick="window.location.href='product.html?id=${p.id}'">
                <div class="similar-img">${p.emoji}</div>
                <div class="similar-name">${p.name}</div>
                <div class="similar-price">${p.price.toLocaleString()} تومان</div>
            </div>
        `).join('');
    }

    function showToast(msg, type = 'success') {
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');
        toastMsg.innerText = msg;
        toast.classList.add('show');
        if (type === 'error') toast.classList.add('error');
        else toast.classList.remove('error');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }

    loadProducts();
    loadProduct();
    setupRatingStars();
    updateCartCount();
</script>
</body>
</html>
